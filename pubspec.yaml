name: tajweed_practice
description: A multilingual Quran tajweed practice application
publish_to: none
version: 0.9.0+15

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  provider: ^6.1.1
  riverpod: ^2.6.1              # pinned – hive_generator blocks riverpod 3.x (analyzer conflict)

  # Audio playback & recording
  just_audio: ^0.10.5          # Quran audio streaming (Quran.Foundation CDN)

  # Networking & data
  dio: ^5.4.1                  # HTTP client for Quran.Foundation and Tarteel AI
  connectivity_plus: ^7.0.0

  # Local storage & caching
  hive_flutter: ^1.1.0         # Offline verse cache, progress, streak data
  path_provider: ^2.1.2

  # Arabic text & Quranic fonts
  google_fonts: ^8.0.2         # Fallback; Uthmanic Hafs loaded as asset font
  characters: ^1.3.0

  # Internationalisation
  intl: ^0.20.2

  # UI utilities
  cupertino_icons: ^1.0.8
  lottie: ^3.0.0               # Animations (e.g., celebration on quiz completion)
  shimmer: ^3.0.0              # Loading skeletons
  go_router: ^17.1.0           # Declarative routing
  share_plus: ^13.1.0           # Native share sheet for sharing rule summaries
  app_attest: ^0.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.8
  flutter_gen_runner: ^5.9.0   # Asset code generation

flutter:
  uses-material-design: true

  assets:
    - assets/tajweed/            # Local tajweed rule JSON database
    - assets/fonts/OFL-Amiri.txt

  fonts:
    - family: AmiriQuran
      fonts:
        - asset: assets/fonts/AmiriQuran.ttf
